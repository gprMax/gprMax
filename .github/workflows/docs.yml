name: Documentation

on:
  pull_request:
  push:
    branches:
      - master
      - devel
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Documentation (clean Python 3.12)
    # Match .readthedocs.yaml; do not install the solver or test requirements.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation dependencies only
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt
          python -m pip check

      - name: Install image converter
        run: |
          sudo apt-get update
          sudo apt-get install --yes imagemagick

      - name: Build HTML with warnings as errors
        run: python -m sphinx -T -b html -aE -W --keep-going docs/source docs/build/html

      - name: Build LaTeX sources with warnings as errors
        run: python -m sphinx -T -b latex -aE -W --keep-going docs/source docs/build/latex

      - name: Upload documentation preview
        uses: actions/upload-artifact@v7
        with:
          name: documentation-preview
          path: docs/build/html
          if-no-files-found: error
          retention-days: 7
