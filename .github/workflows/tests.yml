name: Unit tests

on:
  pull_request:
    branches:
      - devel
      - master
  push:
    branches:
      - devel
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  serial-without-mpi:
    name: Core install (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      PYTHONFAULTHANDLER: "1"
      PYTHONUNBUFFERED: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: setup.py

      - name: Install core gprMax without MPI
        run: |
          python -m pip install --upgrade pip
          python -m pip uninstall --yes mpi4py pycuda pyopencl pyobjc-framework-Metal
          python -m pip install --editable . pytest

      - name: Verify optional dependency metadata
        run: |
          python -c "import importlib.util; import gprMax; assert all(importlib.util.find_spec(x) is None for x in ('mpi4py', 'pycuda', 'pyopencl', 'Metal'))"

      - name: Run core-install regression tests
        run: python -u -m pytest -q tests/utilities/test_mpi_support.py tests/utilities/test_packaging_extras.py

  mpi-fractals:
    name: MPI fractals (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      PYTHONFAULTHANDLER: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Python 3.12 MPI/FFTW environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: gprmax-mpi-fractals
          cache-environment: true
          create-args: >-
            python=3.12
            pip
            mpi4py
            mpi4py-fft

      - name: Install gprMax with distributed-fractal support
        shell: bash -el {0}
        run: |
          python -m pip install --editable ".[mpi-fractals]" pytest

      - name: Run distributed-FFT compatibility check
        shell: bash -el {0}
        run: |
          python -u -m pytest -q tests/fractals/test_mpi4py_fft_compatibility.py tests/utilities/test_packaging_extras.py

  unit:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MPI4PY_RC_FINALIZE: "0"
      OMP_NUM_THREADS: "1"
      PYTHONFAULTHANDLER: "1"
      PYTHONUNBUFFERED: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            mpi: openmpi
          - os: windows-latest
            mpi: msmpi
          - os: macos-latest
            mpi: mpich

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up MPI runtime
        if: runner.os != 'Linux'
        uses: mpi4py/setup-mpi@v1
        timeout-minutes: 15
        with:
          mpi: ${{ matrix.mpi }}

      - name: Set up Open MPI runtime on Linux
        if: runner.os == 'Linux'
        run: |
          python -m pip install openmpi==5.0.10
          mpiexec --version

      - name: Install gprMax and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --editable ".[mpi]"

      - name: Import smoke test
        run: python -u -c "import gprMax; from gprMax.fractals.fractal_surface import FractalSurface; print('imports ok')"

      - name: Run unit tests
        run: python -u -m pytest -m unit
