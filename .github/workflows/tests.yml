name: tests

on:
  pull_request:
  push:
    branches:
      - gsoc26-unit-testing
      - devel
      - master

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            setup.py
            pyproject.toml

      - name: Set up MPI runtime
        uses: mpi4py/setup-mpi@v1

      - name: Upgrade pip tooling
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install mpi4py (pulled by gprMax import chain)
        run: pip install mpi4py

      - name: Install gprMax (builds Cython extensions)
        run: pip install -e .

      - name: Install test dependencies
        run: pip install pytest

      - name: Import smoke test
        run: python -u -c "import gprMax; from gprMax.fractals.fractal_surface import FractalSurface; print('imports ok')"

      - name: Run unit tests
        run: python -u -m pytest tests/unit/ -v
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
          OMP_NUM_THREADS: "1"
          MPI4PY_RC_INITIALIZE: "0"
          MPI4PY_RC_FINALIZE: "0"
