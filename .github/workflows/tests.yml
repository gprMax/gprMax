name: Unit tests

on:
  pull_request:
    branches:
      - devel
      - master
  push:
    branches:
      - devel
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MPI4PY_RC_FINALIZE: "0"
      OMP_NUM_THREADS: "1"
      PYTHONFAULTHANDLER: "1"
      PYTHONUNBUFFERED: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            mpi: openmpi
          - os: windows-latest
            mpi: msmpi
          - os: macos-latest
            mpi: mpich

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up MPI runtime
        uses: mpi4py/setup-mpi@v1
        timeout-minutes: 5
        with:
          mpi: ${{ matrix.mpi }}

      - name: Configure Linux MPI transport
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "FI_PROVIDER=shm" >> "$GITHUB_ENV"
          echo "UCX_TLS=self,sm" >> "$GITHUB_ENV"

      - name: Install gprMax and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --editable .

      - name: Import smoke test
        run: python -u -c "import gprMax; from gprMax.fractals.fractal_surface import FractalSurface; print('imports ok')"

      - name: Run unit tests
        run: python -u -m pytest -m unit
