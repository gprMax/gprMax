name: pytest

on:
  pull_request:
  push:
    branches:
      - devel
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pytest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-tests:
    name: CPU tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FI_PROVIDER: shm

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Open MPI runtime
        timeout-minutes: 5
        run: |
          python -m pip install --upgrade pip
          python -m pip install openmpi==5.0.10
          mpiexec --version

      - name: Install gprMax and test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --editable ".[mpi]"

      - name: Run standard CPU test selection
        run: python -m pytest -m "not unit and not gpu and not slow"
