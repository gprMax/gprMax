name: pytest

on:
  pull_request:
  push:
    branches:
      - devel
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pytest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-tests:
    name: CPU tests
    runs-on: ubuntu-latest
    # Includes dependency installation and the full CPU integration suite.
    timeout-minutes: 60
    env:
      FI_PROVIDER: shm
      # These tests use local ranks, not RDMA. Avoid probing the hosted
      # runner's partially supported Azure network device through UCX.
      OMPI_MCA_pml: ob1
      OMPI_MCA_btl: self,sm,tcp

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Open MPI runtime
        timeout-minutes: 5
        run: |
          python -m pip install --upgrade pip
          python -m pip install openmpi==5.0.10
          mpiexec --version

      - name: Install gprMax and test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --editable ".[mpi]"

      - name: Run standard CPU test selection
        run: python -m pytest -m "not unit and not gpu and not slow" --durations=20
