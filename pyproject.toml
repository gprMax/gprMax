[build-system]
requires = ['setuptools>=64', 'wheel', 'numpy>=1.19.0', 'Cython>=0.29.21',
            'jinja2']
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 120

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "unit: isolated test that does not execute a complete gprMax model",
    "integration: exercises multiple gprMax components or executes a complete model",
    "gpu: requires execution on a real GPU device",
    "slow: normally takes more than 10 seconds on a development machine",
]
