# This file may be used to create a conda environment using:
# $ conda env create -f conda_env.yml
# $ conda activate gprMax-v4
# Use --name to select a different name when keeping multiple v4 installations.

name: gprMax-v4
channels:
- conda-forge
- nodefaults
dependencies:
- python=3.12
- colorama
- cython
- h5py
- jinja2
- jupyter
- matplotlib
- meshio
- nibabel
- numpy
- pillow
- pip
- psutil
- pytest>=7
- pynrrd
- pyvista
- pythonocc-core
- scipy
- simpleitk

- pip:
  - humanize
  # MPI is optional. After creating this environment, use
  # pip install -e ".[mpi]" or pip install -e ".[mpi-fractals]".
  - numpy-stl
  # Accelerator bindings are optional. After creating this environment, use
  # pip install -e ".[cuda]", ".[opencl]", or ".[metal]" as appropriate.
  # The ".[accelerators]" extra requests all backends for this platform.
  - terminaltables
  - tqdm
